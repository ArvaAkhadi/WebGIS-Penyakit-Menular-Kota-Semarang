<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cek Data Laporan — WebGIS Admin</title>
<link rel="stylesheet" href="css/fontawesome-all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'Segoe UI', Tahoma, sans-serif; background:#ecf0f1; min-height:100vh; }

  .topbar {
    background: #2c3e50; color: #fff;
    padding: 14px 24px;
    display: flex; align-items: center; gap: 12px;
    font-size: 13px;
  }
  .topbar a { color:#fff; text-decoration:none; }
  .topbar .title { font-weight: 700; }

  .page-wrap {
    max-width: 1200px;
    margin: 24px auto;
    padding: 0 20px;
  }
  .page-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 20px;
  }
  .page-header h2 {
    font-size: 18px; color: #2c3e50;
  }
  .refresh-btn {
    padding: 8px 16px;
    background: #3498db; color: #fff;
    border: none; border-radius: 6px;
    font-size: 12px; cursor: pointer;
    font-family: inherit;
  }
  .refresh-btn:hover { background: #2980b9; }

  .table-card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    overflow: hidden;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 12px;
  }
  thead {
    background: #2c3e50;
    color: #fff;
  }
  thead th {
    padding: 12px 10px;
    text-align: left;
    font-weight: 600;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.3px;
  }
  tbody tr {
    border-bottom: 1px solid #ecf0f1;
    transition: background 0.15s;
  }
  tbody tr:hover { background: #f8f9fa; }
  tbody td {
    padding: 10px;
    color: #34495e;
    vertical-align: top;
  }
  tbody td.small { font-size: 11px; color: #7f8c8d; }

  .badge {
    display: inline-block;
    padding: 3px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 600;
  }
  .badge.pending  { background: #fff3cd; color: #856404; }
  .badge.approved { background: #d4edda; color: #155724; }
  .badge.rejected { background: #f8d7da; color: #721c24; }

  .btn-aksi {
    display: inline-flex; align-items: center; gap: 4px;
    padding: 5px 10px;
    border: none; border-radius: 4px;
    font-size: 11px; cursor: pointer;
    font-family: inherit; margin-right: 4px;
  }
  .btn-verif { background: #27ae60; color: #fff; }
  .btn-verif:hover { background: #1e8449; }
  .btn-tolak { background: #e74c3c; color: #fff; }
  .btn-tolak:hover { background: #c0392b; }
  .btn-aksi:disabled { background: #95a5a6; cursor: not-allowed; }

  .empty-msg {
    text-align: center;
    padding: 60px 20px;
    color: #95a5a6;
    font-size: 13px;
  }
  .empty-msg i { font-size: 40px; display: block; margin-bottom: 12px; opacity: 0.4; }

  .filter-row {
    display: flex; gap: 10px; margin-bottom: 16px;
    align-items: center;
  }
  .filter-row select {
    padding: 7px 12px;
    border: 1px solid #dfe6e9;
    border-radius: 6px;
    font-size: 12px;
    font-family: inherit;
  }
</style>
</head>
<body>

<div class="topbar">
  <a href="map.html"><i class="fas fa-arrow-left"></i> Kembali ke Dashboard</a>
  <div class="title">Verifikasi Laporan Kasus Penyakit Menular — Kota Semarang</div>
</div>

<div class="page-wrap">
  <div class="page-header">
    <h2><i class="fas fa-clipboard-check" style="color:#3498db;"></i> Cek Data Laporan Kasus (Admin)</h2>
    <button class="refresh-btn" onclick="loadReports()">
      <i class="fas fa-sync-alt"></i> Refresh
    </button>
  </div>

  <div class="filter-row">
    <label style="font-size:12px;color:#34495e;">Filter Status:</label>
    <select id="filterStatus" onchange="loadReports()">
      <option value="">Semua</option>
      <option value="pending" selected>Menunggu Verifikasi</option>
      <option value="approved">Disetujui</option>
      <option value="rejected">Ditolak</option>
    </select>
  </div>

  <div class="table-card">
    <div id="tableContainer">
      <div class="empty-msg"><i class="fas fa-spinner fa-spin"></i> Memuat laporan...</div>
    </div>
  </div>
</div>

<script>
  if (!requireAdmin()) { /* redirect */ }

  async function loadReports() {
    const status = document.getElementById('filterStatus').value;
    const container = document.getElementById('tableContainer');
    container.innerHTML = '<div class="empty-msg"><i class="fas fa-spinner fa-spin"></i> Memuat laporan...</div>';

    try {
      let query = supabaseClient.from('reports').select('*').order('created_at', { ascending: false });
      if (status) query = query.eq('status', status);

      const { data, error } = await query;
      if (error) throw error;

      if (!data || data.length === 0) {
        container.innerHTML = '<div class="empty-msg"><i class="fas fa-inbox"></i> Tidak ada laporan.</div>';
        return;
      }

      renderTable(data);
    } catch (err) {
      console.error(err);
      container.innerHTML = '<div class="empty-msg" style="color:#c0392b;"><i class="fas fa-exclamation-triangle"></i> Gagal memuat: ' + err.message + '</div>';
    }
  }

  function renderTable(reports) {
    const container = document.getElementById('tableContainer');
    let html = '<table><thead><tr>' +
      '<th>ID Laporan</th><th>Informan</th><th>Penderita</th>' +
      '<th>Domisili</th><th>Kondisi</th><th>Waktu Laporan</th>' +
      '<th>Aksi Verifikasi</th></tr></thead><tbody>';

    reports.forEach(r => {
      const badgeClass = r.status === 'pending' ? 'pending' : r.status === 'approved' ? 'approved' : 'rejected';
      const badgeText = r.status === 'pending' ? 'Pending' : r.status === 'approved' ? 'Disetujui' : 'Ditolak';
      const canVerify = r.status === 'pending';

      html += '<tr>' +
        '<td class="small">LPR-' + (r.id ? r.id.substring(0, 8) : '—') + '</td>' +
        '<td class="small"><b>' + (r.reporter_name || '—') + '</b><br>' +
          '<i style="color:#95a5a6;">' + (r.reporter_phone || '') + '</i></td>' +
        '<td class="small"><b>' + (r.patient_name || '—') + '</b><br>' +
          '<i style="color:#95a5a6;">' + (r.patient_contact || '') + '</i></td>' +
        '<td class="small">' + (r.kecamatan || '—') + '</td>' +
        '<td class="small">' + (r.kondisi || '—') + '</td>' +
        '<td class="small">' + new Date(r.created_at).toLocaleString('id-ID') + '</td>' +
        '<td>' +
          '<span class="badge ' + badgeClass + '" style="margin-right:6px;">' + badgeText + '</span>' +
          (canVerify
            ? '<button class="btn-aksi btn-verif" onclick="verifyReport(\'' + r.id + '\', \'approved\')"><i class="fas fa-check"></i> Terima</button>' +
              '<button class="btn-aksi btn-tolak" onclick="verifyReport(\'' + r.id + '\', \'rejected\')"><i class="fas fa-times"></i> Tolak</button>'
            : '') +
        '</td>' +
        '</tr>';
    });

    html += '</tbody></table>';
    container.innerHTML = html;
  }

  async function verifyReport(id, status) {
    const verb = status === 'approved' ? 'menyetujui' : 'menolak';
    if (!confirm('Yakin ingin ' + verb + ' laporan ini?')) return;

    try {
      const updates = { status: status, verified_at: new Date().toISOString() };
      const { error } = await supabaseClient.from('reports').update(updates).eq('id', id);
      if (error) throw error;

      alert('✓ Laporan berhasil di-' + (status === 'approved' ? 'setujui' : 'tolak') + '.');
      loadReports();
    } catch (err) {
      console.error(err);
      alert('✗ Gagal: ' + err.message);
    }
  }

  // Load awal
  loadReports();
</script>
</body>
</html>
